name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Guards the design-token rules (no raw hex, no ad-hoc --meda-* vars) in
      # src/shell. It lives in the "quality" script, but "quality" never ran in
      # CI, so the script sat broken on a missing fast-glob dependency unnoticed.
      - run: pnpm lint:tokens

      - run: pnpm typecheck

      - run: pnpm check:stories

  test:
    runs-on: ubuntu-latest
    env:
      # Use the Chrome binary already available on GitHub-hosted runners.
      # This avoids long Playwright browser downloads on cache misses.
      MEDA_USE_SYSTEM_CHROME: '1'
    steps:
      # On pull_request, actions/checkout defaults to checking out the synthetic
      # `refs/pull/N/merge` commit, which doesn't exist upstream. DeepSource's
      # test-coverage analyzer keys artifacts by commit SHA; if it can't find
      # the SHA upstream it times out with "Artifact was never reported". We
      # check out the PR head SHA so coverage is tied to a real commit.
      # Ref: https://docs.deepsource.com/docs/analyzers-test-coverage#with-github-actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # demo/src/App.tsx imports from `@medalsocial/meda`, which resolves to
      # the package's built `dist/`. dist/ is not committed (regenerated by
      # prepack on publish), so we build before running the demo tests.
      - run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Upload lcov coverage to DeepSource so we can track it over time.
      # Requires the `DEEPSOURCE_DSN` repo secret and the Test Coverage
      # analyzer enabled in DeepSource UI. Skipped on forks (no secret).
      # Pinned, checksum-verified download instead of `curl … | sh`.
      #
      # `https://cli.deepsource.com/install` is an unversioned installer piped
      # straight into a shell: whatever that URL serves at the moment CI runs
      # executes with the job's environment, and nothing anchors it to a
      # release anyone reviewed. That is OpenSSF Scorecard's
      # `PinnedDependenciesID` finding on this file ("downloadThenRun not
      # pinned by hash"), and it is a real supply-chain edge, not a formality.
      #
      # Bumping this: pick a tag from
      # https://github.com/DeepSourceCorp/cli/releases, take the
      # `linux_amd64` line out of that release's `checksums.txt`, and update
      # both constants below. Mismatched digest = failed job, by design.
      - name: Install DeepSource CLI
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
          DEEPSOURCE_CLI_VERSION: '0.10.1'
          DEEPSOURCE_CLI_SHA256: 'e415a6a53257457ef1dad900fdb39aeb991dd01c35c4be9cafa88a41f9e50b3b'
        run: |
          set -euo pipefail
          archive="deepsource_${DEEPSOURCE_CLI_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DeepSourceCorp/cli/releases/download/v${DEEPSOURCE_CLI_VERSION}/${archive}"
          mkdir -p ./bin
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$archive" "$url"
          echo "${DEEPSOURCE_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C ./bin deepsource
          chmod +x ./bin/deepsource
          ./bin/deepsource version

      - name: Report coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: ./bin/deepsource report --analyzer test-coverage --key javascript --value-file ./coverage/lcov.info

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Validate registry
        run: pnpm registry:validate

      # size-limit runs against the freshly-built dist/, so we collapse it
      # into the build job to avoid a duplicate `pnpm install` + `pnpm build`
      # in a separate job. The `build` job name is preserved so the required
      # status-check rule on dev/prod still resolves.
      - run: pnpm size-limit
