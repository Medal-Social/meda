name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm check:stories

  test:
    runs-on: ubuntu-latest
    env:
      # Pin Playwright's browser dir explicitly so the cache key matches the
      # install location regardless of runner-image changes to $HOME defaults.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      # On pull_request, actions/checkout defaults to checking out the synthetic
      # `refs/pull/N/merge` commit, which doesn't exist upstream. DeepSource's
      # test-coverage analyzer keys artifacts by commit SHA; if it can't find
      # the SHA upstream it times out with "Artifact was never reported". We
      # check out the PR head SHA so coverage is tied to a real commit.
      # Ref: https://docs.deepsource.com/docs/analyzers-test-coverage#with-github-actions
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries (Chromium only — that's all the
      # vitest 'storybook' project uses). Key on lockfile so a Playwright
      # version bump invalidates automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The vitest 'storybook' project runs every *.stories.tsx in headless
      # Chromium via @vitest/browser-playwright, so the browser binary needs
      # to be present before `pnpm test` runs. On cache hit we only install
      # system deps (no re-download); on miss we do the full install.
      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # demo/src/App.tsx imports from `@medalsocial/meda`, which resolves to
      # the package's built `dist/`. dist/ is not committed (regenerated by
      # prepack on publish), so we build before running the demo tests.
      - run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Upload lcov coverage to DeepSource so we can track it over time.
      # Requires the `DEEPSOURCE_DSN` repo secret and the Test Coverage
      # analyzer enabled in DeepSource UI. Skipped on forks (no secret).
      - name: Install DeepSource CLI
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh

      - name: Report coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: ./bin/deepsource report --analyzer test-coverage --key javascript --value-file ./coverage/lcov.info

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Validate registry
        run: pnpm registry:validate

      # size-limit runs against the freshly-built dist/, so we collapse it
      # into the build job to avoid a duplicate `pnpm install` + `pnpm build`
      # in a separate job. The `build` job name is preserved so the required
      # status-check rule on dev/prod still resolves.
      - run: pnpm size-limit
