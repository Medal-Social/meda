# check-skills.yml — TanStack Intent skill validation + coverage review.
#
# Generated by `npx @tanstack/intent setup`, then edited to match meda's
# existing CI conventions:
#   - SHA-pinned actions
#   - pnpm with frozen lockfile, node 24
#   - `pnpm exec intent` against the locally-pinned @tanstack/intent
#   - Least-privilege permissions (workflow-level read-only; review job
#     elevates to write only where needed)
#   - Review job mints a Release Bot App token so the resulting branch
#     push + PR open cascades to downstream workflows (auto-approve,
#     auto-merge). GITHUB_TOKEN-attributed events do NOT cascade.
#
# Triggers:
#   - PRs touching skills/** or _artifacts/** → blocking validate job
#   - Releases or manual dispatch → non-blocking stale/coverage review
#
# intent-workflow-version: 3

name: Check Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '**/skills/**'
      - '_artifacts/**'
      - '**/_artifacts/**'
  release:
    types: [published]
  workflow_dispatch: {}

# Default to read-only. Each job elevates only what it needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate intent skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate skills
        run: pnpm exec intent validate --github-summary

  review:
    name: Check intent skill coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN intentionally stays at workflow-level read. We use a
    # Release Bot App token below for the writes so downstream workflows
    # (auto-approve etc.) trigger on the resulting PR.
    permissions:
      contents: read
    env:
      # This job is the third commit site in the repo and carries the same
      # latent failure as the release `version` job: it runs `pnpm install`
      # (which wires `core.hooksPath` via `prepare: husky`) and then
      # `git commit --allow-empty`, which fires `pre-commit` — the full
      # browser-backed Vitest suite — on a runner with no Playwright browser.
      #
      # It has never actually failed, and the reason is worth writing down:
      # the commit lives inside the `has_review == 'true'` step, and skills
      # have never drifted, so that step has been SKIPPED on every release to
      # date (verified on the 2.8.0 run, job 106158955989, step 8). The green
      # history is not evidence the path works — it is evidence the path has
      # never been taken. The first time skills drift, it would have taken it.
      #
      # See the `version` job in release.yml for the full reasoning.
      HUSKY: 0
    steps:
      - name: Generate Medal Social Release Bot token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check skills
        id: stale
        run: pnpm exec intent stale --github-review --package-label "@medalsocial/meda"

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ github.event.release.tag_name || 'manual' }}"
          BRANCH="skills/review-${VERSION}"
          BASE_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name 'medal-social-release-bot[bot]'
          git config user.email 'medal-social-release-bot[bot]@users.noreply.github.com'

          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
            git commit --allow-empty -m "chore: review intent skills for ${VERSION}"
            git push origin "$BRANCH"
          fi

          # `--jq '.[0].url'` emits the literal string "null" when no PR
          # exists for this head, which previously made the `-n` guard
          # below pass and triggered `gh pr edit null`. `// empty` returns
          # an empty string in that case so the create path runs.
          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
          else
            gh pr create \
              --title "Review intent skills (${VERSION})" \
              --body-file pr-body.md \
              --head "$BRANCH" \
              --base "$BASE_BRANCH"
          fi
