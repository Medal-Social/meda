name: Chromatic

# Auto-runs intentionally disabled — re-enable explicitly when ready to spend
# credits and accept new baselines. Use `workflow_dispatch` to run manually.
on:
  workflow_dispatch:
  # push:
  #   branches: [dev, prod]
  # pull_request:
  #   branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Check Chromatic token
        id: chromatic-token
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.chromatic-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.chromatic-token.outputs.available == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.chromatic-token.outputs.available == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.chromatic-token.outputs.available == 'true'

      - name: Publish to Chromatic
        if: steps.chromatic-token.outputs.available == 'true'
        run: pnpm chromatic

      - name: Skip Chromatic
        if: steps.chromatic-token.outputs.available != 'true'
        run: echo "Skipping Chromatic because CHROMATIC_PROJECT_TOKEN is not available."
