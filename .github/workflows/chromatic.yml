name: Chromatic

# TEMPORARY: auto-runs disabled during the storybook cleanup plan
# (docs/superpowers/plans/2026-04-28-storybook-cleanup.md) so we don't burn
# Chromatic credits on intermediate baselines while the story tree is in flux.
# Restore the push/pull_request triggers in the final task of the plan, after
# the prune is complete and we're ready to accept the new baselines.
on:
  workflow_dispatch:
  # push:
  #   branches: [dev, prod]
  # pull_request:
  #   branches: [dev, prod]

permissions:
  contents: read

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Check Chromatic token
        id: chromatic-token
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.chromatic-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.chromatic-token.outputs.available == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.chromatic-token.outputs.available == 'true'
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile
        if: steps.chromatic-token.outputs.available == 'true'

      - name: Publish to Chromatic
        if: steps.chromatic-token.outputs.available == 'true'
        run: pnpm chromatic

      - name: Skip Chromatic
        if: steps.chromatic-token.outputs.available != 'true'
        run: echo "Skipping Chromatic because CHROMATIC_PROJECT_TOKEN is not available."
