name: Release

# Three modes, one workflow file — deliberately. npm trusted publishing (OIDC)
# is bound to a repository + workflow FILE NAME + environment, so every path
# that publishes has to live in `release.yml` under `environment: npm`. Adding
# a second publishing workflow would need Ada to register it with npm first;
# splitting the non-publishing half out is safe but not worth the churn.
#
#   1. push to `dev`   -> version. Opens/updates the Changesets
#                         "Version Packages" PR against `dev`. Publishes
#                         nothing and touches no npm credential.
#   2. push to `prod`  -> publish. `dev` already carries the bumped version and
#                         has no pending changesets, so this is a pure
#                         `changeset publish`: npm + provenance + git tags.
#   3. workflow_dispatch with mode=snapshot -> publish a throwaway
#                         `x.y.z-<tag>-<sha>` build from any branch under a
#                         non-`latest` dist-tag. Commits and pushes nothing.
#
# Why the version bump happens on `dev` and not on `prod`:
# it is the one change that removes the whole "sync prod back into dev" class
# of work. When the bump lands on `dev` first, `prod` never gains content that
# `dev` lacks, so the promote merge is conflict-free by construction and there
# is nothing to merge back. See CONTRIBUTING.md -> "Releasing".

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = publish the version currently on this ref; snapshot = publish a throwaway prerelease'
        type: choice
        options: [release, snapshot]
        default: release
      snapshot_tag:
        description: 'npm dist-tag / version suffix for mode=snapshot (never "latest")'
        type: string
        default: snapshot

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # 1. dev -> open or refresh the "Version Packages" PR.
  # ---------------------------------------------------------------------------
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # No `environment: npm`, no `id-token`, no npm registry auth. This job
    # cannot publish, and keeping it credential-free is the point: it runs on
    # every single push to `dev`.
    permissions: {}
    steps:
      # Every git/PR write below uses the Release Bot App token, never
      # GITHUB_TOKEN — events attributed to github-actions[bot] do not trigger
      # other workflows, which would strand the Version PR without CI.
      - name: Generate Release Bot token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `changesets/action` bases the PR on the ref it runs from, so this opens
      # `changeset-release/dev` -> `dev`. No `publish:` input, so the action
      # never reaches for an npm credential even if it wanted one.
      - name: Create or update the Version Packages PR
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commit: 'chore: version @medalsocial/meda'
          title: 'chore: version @medalsocial/meda'
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # ---------------------------------------------------------------------------
  # 2. prod -> publish whatever version the promoted tree carries.
  # ---------------------------------------------------------------------------
  publish:
    # A `release` dispatch is the re-run handle for a publish that failed after
    # the promote PR merged. It is pinned to `prod` on purpose: dispatched from
    # `dev` it would publish the version `dev` is *staging*, which is precisely
    # the accident this flow exists to make impossible.
    if: |
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    runs-on: ubuntu-latest
    environment: npm
    env:
      # Use the Chrome binary already available on GitHub-hosted runners. The
      # release action may invoke Husky, which runs the browser-backed Vitest
      # storybook project via `pnpm test`.
      MEDA_USE_SYSTEM_CHROME: '1'
    # GITHUB_TOKEN gets only what the npm OIDC + provenance steps need. All
    # git/tag writes use the Release Bot App token, so `contents: write` here
    # would only widen the blast radius of a compromised action.
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Generate Release Bot token (checkout)
        id: app-token-checkout
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token-checkout.outputs.token }}

      # Fail closed rather than publish something incoherent. Under this flow
      # the bump happens on `dev`, so a changeset arriving here means the
      # Version Packages PR was skipped and `package.json` still holds the
      # ALREADY-PUBLISHED version. `changeset publish` would then quietly
      # no-op and the release would look green while shipping nothing.
      - name: Refuse to publish with pending changesets
        run: |
          set -euo pipefail
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print)"
          if [ -n "$pending" ]; then
            echo "::error::Pending changesets are present on this ref:"
            printf '%s\n' "$pending"
            echo "The version bump belongs on 'dev'. Merge the 'chore: version @medalsocial/meda'"
            echo "PR into 'dev' first, then re-run the promote PR."
            exit 1
          fi
          echo "No pending changesets — safe to publish."

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # App tokens expire after an hour and install + build can eat a chunk of
      # that on a slow runner, so re-mint immediately before the publish and
      # refresh the persisted git credential the action pushes tags with.
      - name: Generate Release Bot token (publish)
        id: app-token-publish
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Refresh persisted git credential
        env:
          TOKEN: ${{ steps.app-token-publish.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"

      # Re-running a failed publish is safe: `changeset publish` skips any
      # version already on the registry, and this job never bumps a version, so
      # a retry can only ever finish the same release — never mint a new one.
      - name: Publish to npm
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token-publish.outputs.token }}
          NPM_CONFIG_PROVENANCE: 'true'

  # ---------------------------------------------------------------------------
  # 3. snapshot -> throwaway prerelease from any branch, under its own dist-tag.
  # ---------------------------------------------------------------------------
  snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only checkout with no App token and no persisted credential:
          # a snapshot must never write a commit, a branch or a tag.
          persist-credentials: false

      - name: Validate the snapshot tag
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          set -euo pipefail
          case "$SNAPSHOT_TAG" in
            latest)
              echo "::error::Refusing to publish a snapshot under the 'latest' dist-tag."
              exit 1
              ;;
          esac
          if ! printf '%s' "$SNAPSHOT_TAG" | grep -Eq '^[a-z][a-z0-9-]{0,29}$'; then
            echo "::error::snapshot_tag must match ^[a-z][a-z0-9-]{0,29}$ (got '$SNAPSHOT_TAG')."
            exit 1
          fi
          echo "Snapshot dist-tag: $SNAPSHOT_TAG"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `--snapshot` rewrites package.json in the working tree only. Nothing is
      # committed, so `--no-git-checks` below is about the dirty tree, not about
      # skipping a safety rail.
      - name: Version as a snapshot
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: pnpm exec changeset version --snapshot "$SNAPSHOT_TAG"

      - run: pnpm build

      - name: Publish the snapshot
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm exec changeset publish --tag "$SNAPSHOT_TAG" --no-git-checks

      - name: Summarise
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Snapshot published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$version\` |"
            echo "| dist-tag | \`$SNAPSHOT_TAG\` |"
            echo "| ref | \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` |"
            echo
            echo 'Pin it in a consumer with:'
            echo
            echo '```json'
            echo "\"@medalsocial/meda\": \"$version\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
