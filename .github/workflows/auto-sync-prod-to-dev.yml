name: Auto-sync prod → dev

# After the Changesets Release PR merges to prod and the Release workflow
# publishes successfully, the version-bump commit lands on prod and dev falls
# behind. This workflow opens (and auto-merges) a chore PR that brings dev
# back in sync with prod, eliminating the manual merge-up step.
#
# Escape hatch: include `[skip auto-sync]` in the prod commit message to
# suppress this workflow for that prod push. Manual dispatch always attempts
# the sync after checking whether prod is ahead of dev.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: auto-sync-prod-to-dev
  cancel-in-progress: false

# Two-bot identity model:
#   - Medal Social Release Bot (RELEASE_APP_*)    OPENS the sync PR
#   - Medal Approvals (MEDAL_APPROVALS_*)         APPROVES the sync PR
# These are different App identities, so Medal Approvals can approve a PR
# opened by Release Bot without hitting "cannot approve your own PR".
# GITHUB_TOKEN is intentionally left at zero perms for everything that has to
# cascade — using it for the branch push or the PR would attribute events to
# github-actions[bot], which per GitHub's docs does NOT trigger other
# workflows (auto-approve, auto-merge).
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'prod')
    # `issues: write` is the ONE added scope, and it is on GITHUB_TOKEN rather
    # than the Release Bot App, deliberately: the tracking issue is meant for a
    # human, so the "must cascade to other workflows" argument above does not
    # apply, and this keeps the App's installation permissions untouched. Every
    # git/PR write below still uses the App token. GITHUB_TOKEN gets no
    # `contents` scope — `actions/checkout` is passed the App token explicitly.
    permissions:
      issues: write
    env:
      # One tracking issue, found by exact title so the workflow can update
      # rather than pile up duplicates.
      TRACKING_ISSUE_TITLE: 'Auto-sync prod → dev needs a manual merge'
    steps:
      - name: Classify trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RELEASE_EVENT: ${{ github.event.workflow_run.event || '' }}
          RELEASE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          RELEASE_HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: |
          should_sync=false
          reason='not a successful Release workflow on prod'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            should_sync=true
            reason='manual dispatch'
          elif [ "$RELEASE_CONCLUSION" = 'success' ] &&
            [ "$RELEASE_EVENT" = 'push' ] &&
            [ "$RELEASE_HEAD_BRANCH" = 'prod' ]; then
            if printf '%s' "$RELEASE_HEAD_MESSAGE" | grep -Fq '[skip auto-sync]'; then
              reason='prod push requested auto-sync skip'
            else
              should_sync=true
              reason='successful Release workflow on prod'
            fi
          fi

          echo "should_sync=$should_sync" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Auto-sync classification: $reason (should_sync=$should_sync)"

      - name: Generate Medal Social Release Bot token
        if: steps.trigger.outputs.should_sync == 'true'
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.trigger.outputs.should_sync == 'true'
        with:
          fetch-depth: 0
          # Need both branches available locally to compute divergence and
          # produce the merge.
          ref: prod
          # Use the Release Bot's App token so the push attributing the
          # sync branch comes from a real App identity (which DOES trigger
          # downstream workflows like auto-approve and auto-merge).
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        if: steps.trigger.outputs.should_sync == 'true'
        run: |
          git config user.name 'medal-social-release-bot[bot]'
          git config user.email 'medal-social-release-bot[bot]@users.noreply.github.com'

      - name: Check whether prod has commits not on dev
        if: steps.trigger.outputs.should_sync == 'true'
        id: divergence
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          if [ -z "$(git rev-list origin/dev..HEAD)" ]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "prod is not ahead of dev — nothing to sync."
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs BEFORE the merge, while HEAD is still prod. This case produces no
      # conflict at all — the merge happily keeps dev's copy of a changeset the
      # release already consumed — so without this step it is invisible until
      # the next release republishes the notes and over-bumps the version.
      - name: Detect changesets released on prod but still present on dev
        if: steps.divergence.outputs.needs_sync == 'true'
        id: stale
        run: |
          node scripts/detect-stale-changesets.mjs --prod HEAD --dev origin/dev \
            | tee "$RUNNER_TEMP/stale.md"
          if [ -s "$RUNNER_TEMP/stale.md" ]; then
            echo "Stale changesets detected — see the report above."
          else
            echo "No released-but-unremoved changesets on dev."
          fi

      - name: Check for an existing auto-sync PR
        if: steps.divergence.outputs.needs_sync == 'true'
        id: existing-sync-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sync_target_sha="$(git rev-parse HEAD)"
          existing_pr=''

          while IFS=$'\t' read -r head_ref head_repo url; do
            if [ -z "$head_ref" ]; then
              continue
            fi

            if [ "$head_repo" != '${{ github.repository }}' ]; then
              echo "Ignoring auto-sync-looking PR from $head_repo: $url"
              continue
            fi

            if ! git fetch --quiet origin "refs/heads/$head_ref" 2>/dev/null; then
              echo "Ignoring auto-sync PR with missing origin branch $head_ref: $url"
              continue
            fi

            if git merge-base --is-ancestor "$sync_target_sha" FETCH_HEAD; then
              existing_pr="$url"
              echo "Existing auto-sync PR already contains prod commit $sync_target_sha: $url"
              break
            fi

            echo "Existing auto-sync PR does not contain prod commit $sync_target_sha: $url"
          done < <(gh pr list \
            --repo "${{ github.repository }}" \
            --base dev \
            --state open \
            --limit 100 \
            --json headRefName,headRepository,url \
            --jq '.[] | select(.headRefName | startswith("chore/auto-sync-prod-to-dev-")) | [.headRefName, .headRepository.nameWithOwner, .url] | @tsv')

          if [ -n "$existing_pr" ]; then
            echo "has_existing=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            echo "has_existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge dev into it
        if: steps.divergence.outputs.needs_sync == 'true' && steps.existing-sync-pr.outputs.has_existing != 'true'
        id: branch
        run: |
          BRANCH="chore/auto-sync-prod-to-dev-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          # Merge origin/dev into the prod-based branch so the resulting PR
          # cleanly fast-forwards (or three-way merges) into dev.
          if ! git merge --no-edit origin/dev; then
            # Record the conflicted paths, then ABORT. The branch is never
            # pushed and no PR is opened from a conflicted tree: this repo runs
            # auto-approve and `gh pr merge --auto` on the
            # `chore/auto-sync-prod-to-dev-` prefix, so a PR carrying conflict
            # markers would be one rule away from landing on dev. The report
            # step below fails the job.
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort || true
            echo "Merge conflict between prod and dev — manual intervention required."
            cat "$RUNNER_TEMP/conflicts.txt"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR and enable auto-merge
        if: |
          steps.divergence.outputs.needs_sync == 'true' &&
          steps.existing-sync-pr.outputs.has_existing != 'true' &&
          steps.branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/sync-pr.md"
          {
            echo 'Automated sync after a successful Changesets release on `prod`. Brings `dev`'
            echo 'back in line with `prod` so the next feat → dev → prod cycle starts from a'
            echo 'clean ancestry.'
            echo
            echo '**Merge this with a merge commit, never a squash.** A squash drops the second'
            echo 'parent, so `prod` does not become an ancestor of `dev` and the next auto-sync'
            echo 'conflicts all over again — exactly what happened with #222 and needed #223 to'
            echo 'repair.'
          } > "$BODY"

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base dev \
            --head "$BRANCH" \
            --title 'chore: auto-sync prod → dev' \
            --body-file "$BODY")
          echo "Opened: $PR_URL"
          gh pr merge --auto --merge \
            --repo "${{ github.repository }}" \
            "$PR_URL"

      # ---------------------------------------------------------------------
      # Make a sync that needs hands impossible to miss.
      #
      # Two conditions land here, and neither used to surface anywhere a human
      # would look: a merge conflict (previously a bare `exit 1` inside a step
      # log) and a released-but-unremoved changeset (previously nothing at all,
      # because it does not conflict).
      # ---------------------------------------------------------------------
      - name: Report a sync that needs hands
        if: |
          !cancelled() &&
          (steps.branch.outputs.conflict == 'true' || steps.stale.outputs.stale == 'true')
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ steps.branch.outputs.conflict }}
          STALE: ${{ steps.stale.outputs.stale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PROD_SHA="$(git rev-parse origin/prod 2>/dev/null || git rev-parse HEAD)"
          DEV_SHA="$(git rev-parse origin/dev)"
          BODY="$RUNNER_TEMP/tracking-issue.md"

          {
            echo "\`prod\` has changes that could not be synced into \`dev\` automatically."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| \`prod\` | \`$PROD_SHA\` |"
            echo "| \`dev\` | \`$DEV_SHA\` |"
            echo "| run | $RUN_URL |"
            echo
          } > "$BODY"

          if [ "$CONFLICT" = 'true' ]; then
            {
              echo "### Merge conflict"
              echo
              echo "Merging \`origin/dev\` into \`prod\` conflicts in:"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
              echo
              echo "Nothing was pushed and no PR was opened — the merge was aborted on the"
              echo "runner so a conflicted tree can never reach a branch that auto-merge watches."
              echo
            } >> "$BODY"
          fi

          if [ "$STALE" = 'true' ]; then
            cat "$RUNNER_TEMP/stale.md" >> "$BODY"
            echo >> "$BODY"
          fi

          {
            echo "### Manual recipe"
            echo
            echo '```bash'
            echo "git fetch origin"
            echo "git switch -c chore/sync-prod-to-dev origin/dev"
            echo "git merge origin/prod         # resolve any conflicts"
            echo "git rm .changeset/<released>.md   # only if listed above"
            echo "pnpm exec changeset status --verbose   # confirm the next bump"
            echo "git push -u origin chore/sync-prod-to-dev"
            echo '```'
            echo
            echo "Open the PR against \`dev\` and **merge it with a merge commit, not a squash**"
            echo "— a squash discards the second parent, so \`prod\` never becomes an ancestor of"
            echo "\`dev\` and the next auto-sync conflicts again (#222 → #223)."
            echo
            echo "This issue is updated on every failed run and closed automatically by the"
            echo "first healthy sync."
          } >> "$BODY"

          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"

          number="$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TRACKING_ISSUE_TITLE\")][0].number // empty")"

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "${{ github.repository }}" --body-file "$BODY"
            gh issue comment "$number" --repo "${{ github.repository }}" \
              --body "Still needs a manual merge — refreshed from $RUN_URL."
            echo "Updated tracking issue #$number"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TRACKING_ISSUE_TITLE" --body-file "$BODY"
          fi

          echo "::error::prod → dev needs a manual merge. See the job summary and the tracking issue."
          exit 1

      - name: Close the tracking issue after a healthy sync
        if: success() && steps.trigger.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TRACKING_ISSUE_TITLE\")][0].number // empty")"

          if [ -z "$number" ]; then
            echo "No open tracking issue — nothing to close."
            exit 0
          fi

          gh issue comment "$number" --repo "${{ github.repository }}" \
            --body "prod → dev synced cleanly in $RUN_URL. Closing."
          gh issue close "$number" --repo "${{ github.repository }}"
          echo "Closed tracking issue #$number"
