name: Auto-merge promote PRs

# Enables auto-merge on the recurring automation PRs:
#   1. The Changesets "Version Packages" PR (head ref `changeset-release/*`).
#      Since the version bump moved onto `dev`, that PR targets `dev`, which
#      is why this workflow is no longer scoped to `prod` as a base.
#   2. The hand-opened dev → prod promotion PR (head ref `dev`) — the manual
#      fallback for when `promote.yml` cannot run.
# Auto-merge waits for required status checks AND the required approval before
# merging, so this is gated exactly as a manual merge would be. It grants
# nothing: `promote.yml` arms auto-merge on the standing release PR itself, and
# nothing here approves anything.
on:
  # `pull_request` (not `pull_request_target`) is intentional: this workflow
  # only ever acts on same-repo promote PRs, so it never needs base-repo
  # context for fork PRs. With `pull_request`, fork PRs run with a read-only
  # GITHUB_TOKEN and the `gh pr merge` write call would fail anyway — so
  # token scope provides defense in depth alongside the same-repo `if` guard
  # below.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, prod]

# GITHUB_TOKEN is left at zero perms — the actual write call uses the
# Medal Approvals App token minted in the job. Auto-merge enabled by the
# default `GITHUB_TOKEN` causes the eventual merge push to be attributed
# to `github-actions[bot]`, and per GitHub's docs events triggered by
# `GITHUB_TOKEN` do NOT cascade to other workflows. That silently breaks
# the post-merge chain (Auto-sync prod → dev, Release, Deploy Worker, …).
# A GitHub App token does NOT have that limitation, so we mint one.
permissions: {}

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Belt-and-braces same-repo gate even though `pull_request` already
    # restricts the token for forks — keeps the no-op early instead of
    # letting it fail with a 403.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.head.ref == 'dev' &&
        github.event.pull_request.base.ref == 'prod') ||
       startsWith(github.event.pull_request.head.ref, 'changeset-release/'))
    permissions: {}
    steps:
      - name: Generate Medal Approvals token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        with:
          app-id: ${{ secrets.MEDAL_APPROVALS_APP_ID }}
          private-key: ${{ secrets.MEDAL_APPROVALS_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge --auto --merge \
            --repo "${{ github.repository }}" \
            "$PR_NUMBER"
