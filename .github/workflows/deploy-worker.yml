name: Deploy Worker

on:
  push:
    branches: [prod]
    paths:
      # Demo source, registry JSON, and worker config
      - 'demo/**'
      - 'registry/**'
      - 'wrangler.toml'
      # The build script that combines demo + registry
      - 'scripts/copy-registry-to-dist.mjs'
      # Library source — demo imports @medalsocial/meda aliased to src/
      - 'src/**'
      # Build inputs that affect the Vite output
      - 'vite.config.demo.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # This workflow itself
      - '.github/workflows/deploy-worker.yml'
      # Storybook config and manager chrome
      - '.storybook/**'

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build worker bundle (demo + registry + Storybook)
        run: pnpm worker:build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required in non-interactive CI when the token can access
          # multiple accounts — makes the deploy deterministic.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
